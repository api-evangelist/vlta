description: VLTA (Volta Charging) is an electric-vehicle charging network that pairs public EV
  chargers with digital out-of-home advertising displays at retail, grocery, and shopping destinations.
  The Volta business was acquired by Shell in 2023; its voltacharging.com domain now redirects to Shell's
  mobility/EV-charging pages, and consumer charging operations are presented under the JOLT brand
  (joltcharge.com) offering a mobile app to locate chargers, start/stop sessions, and view pricing.
  No public developer API, SDK, developer portal, or GitHub organization was found during enrichment;
  this remains an identity/company profile with no API surface.
